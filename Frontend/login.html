<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SmartMandi Farmer Login</title>

    <link rel="stylesheet"
          href="login.css">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            🚜 SmartMandi
        </div>

        <h1>Farmer Login</h1>

        <p>
            Login to check your procurement status
        </p>


        <input
            type="tel"
            id="mobile"
            placeholder="Enter mobile number"
            maxlength="10"
        >


        <button onclick="sendOTP()">
            Send OTP
        </button>


        <div id="otpSection">

            <input
                type="text"
                id="otp"
                placeholder="Enter OTP"
                maxlength="6"
            >

            <button onclick="verifyOTP()">
                Verify OTP
            </button>

        </div>


        <p id="message"></p>

        <a href="index.html">
            ← Back to Home
        </a>

    </div>

</div>


<script src="login.js"></script>

</body>

</html>
